# Netlify configuration for the PRIVATE preview.
# The site is prebuilt into dist/ (run `npm run build` and commit dist/ after
# any change), so Netlify only publishes files: no package install at deploy.
[build]
  command = "echo 'Publishing prebuilt dist/'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  MISSION = "washington"
  PREVIEW = "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--omit=dev --no-audit --no-fund"

# No password gate: the demo is open to anyone with the link (decision of
# Dalal Technologies, 26 Oct 2026). It stays out of search engines via noindex.
# To restore the gate: add an [[edge_functions]] block for "preview-auth".

# SPA fallback so clean URLs like /demarches/sauf-conduit load the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000"
    Cache-Control = "private, no-store"
